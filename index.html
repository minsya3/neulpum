<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>늘품 9기 학급 기록</title>
  <meta name="description" content="늘품 9기 우리 반 학급 기록 앱">
  <meta name="theme-color" content="#FFF8EE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="늘품 9기">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root { color-scheme: light; --bg: #FFF8EE; --ink: #3B3355; --muted: #8B84A0; --mint: #2FBF8F; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    /* 아이폰 노치·홈 버튼 자리를 피해서 앱을 꽉 차게 보여 줍니다. */
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); overflow: hidden; }
    #frame { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
    .cover { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); padding: 24px; text-align: center; z-index: 5; transition: opacity .3s; }
    .cover.hide { opacity: 0; pointer-events: none; }
    .logo { width: 96px; height: 96px; border-radius: 26px; box-shadow: 0 6px 0 #6CC596, 0 16px 34px rgba(47,191,143,.25); animation: bob 1.2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    h1 { font-size: 24px; margin: 18px 0 4px; }
    p { margin: 6px 0; color: var(--muted); }
    .card { max-width: 420px; background: #fff; border-radius: 22px; padding: 22px; box-shadow: 0 10px 30px rgba(59,51,85,.08); text-align: left; }
    .card h2 { font-size: 18px; margin: 0 0 8px; }
    .card ol { margin: 8px 0 0; padding-left: 22px; }
    .card li { margin: 6px 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 10px 20px; border: 0; border-radius: 16px;
      background: var(--mint); color: #fff; font: inherit; font-weight: 700; box-shadow: 0 4px 0 #1F8F69; cursor: pointer; }
    .btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 3px 0 #F1E6D8; border: 2px solid #F1E6D8; }
    .install { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6;
      width: min(440px, calc(100% - 24px)); background: #3B3355; color: #fff; border-radius: 20px; padding: 14px 16px; box-shadow: 0 12px 30px rgba(0,0,0,.25);
      display: flex; align-items: center; gap: 12px; }
    .install img { width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0; }
    .install .txt { flex: 1; font-size: 14px; line-height: 1.45; }
    .install b { display: block; font-size: 16px; }
    .install .x { background: none; border: 0; color: #fff; opacity: .7; font-size: 20px; width: 40px; height: 40px; cursor: pointer; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <!-- 앱 화면: 아래 APP_URL의 웹앱을 꽉 차게 보여 줍니다. -->
  <iframe id="frame" title="늘품 9기 학급 기록" allow="camera; clipboard-write; fullscreen" hidden></iframe>

  <div id="loading" class="cover" aria-live="polite">
    <div>
      <img class="logo" src="icon-192.png" alt="">
      <h1>늘품 9기 학급 기록</h1>
      <p id="loading-text">우리 반을 불러오고 있어요…</p>
    </div>
  </div>

  <div id="setup" class="cover" hidden>
    <div class="card">
      <h2>🔧 선생님, 마지막 한 단계만 남았어요!</h2>
      <p>이 폴더의 <b>index.html</b>을 열어 <code>APP_URL</code>에 Apps Script 웹앱 주소(…/exec)를 붙여 넣어 주세요.</p>
    </div>
  </div>

  <div id="offline" class="cover" hidden>
    <div class="card" style="text-align:center">
      <div style="font-size:54px">📶</div>
      <h2>인터넷에 연결되어 있지 않아요</h2>
      <p>와이파이나 데이터를 켠 뒤 다시 눌러 주세요.</p>
      <button class="btn" type="button" onclick="location.reload()">다시 연결하기</button>
    </div>
  </div>

  <div id="install" class="install" role="dialog" aria-label="앱 설치 안내" hidden>
    <img src="icon-192.png" alt="">
    <div class="txt"><b>늘품 9기를 앱으로 설치해요</b><span id="install-how"></span></div>
    <button id="install-btn" class="btn" type="button" hidden>설치</button>
    <button class="x" type="button" aria-label="닫기" onclick="hideInstall(true)">✕</button>
  </div>

  <script>
    /* ★ 선생님이 바꿀 곳은 여기 한 줄이에요: 배포한 Apps Script 웹앱 주소(…/exec)를 넣어 주세요. */
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwKFJZProAU6xqS8qBHvLfto_0UwJHCm1799tncpEBynkXUoDGWwhRhnVhWJK-2uGdalg/exec';

    const $ = (id) => document.getElementById(id);
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    function store(key, value) { try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; } }

    // 1) 앱 띄우기
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL) || APP_URL.indexOf('여기에') !== -1) {
      $('loading').hidden = true; $('setup').hidden = false;
    } else if (!navigator.onLine) {
      $('loading').hidden = true; $('offline').hidden = false;
    } else {
      const frame = $('frame');
      frame.src = APP_URL;
      frame.hidden = false;
      frame.addEventListener('load', () => setTimeout(() => $('loading').classList.add('hide'), 300));
      setTimeout(() => { $('loading-text').textContent = '조금만 기다려 주세요. 인터넷이 느린가 봐요… 🐢'; }, 8000);
    }
    window.addEventListener('offline', () => { $('offline').hidden = false; });
    window.addEventListener('online', () => { if (!$('offline').hidden) location.reload(); });

    // 2) 설치 안내 (이미 앱으로 열었거나, 닫은 지 7일이 안 됐으면 보이지 않아요)
    let deferred = null;
    function hideInstall(remember) { $('install').hidden = true; if (remember) store('neulpum-install-hidden', String(Date.now())); }
    function showInstall(how, canClick) {
      const hiddenAt = Number(store('neulpum-install-hidden') || 0);
      if (standalone || Date.now() - hiddenAt < 7 * 864e5) return;
      $('install-how').textContent = how;
      $('install-btn').hidden = !canClick;
      setTimeout(() => { $('install').hidden = false; }, 2500);
    }
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferred = e;
      showInstall('홈 화면에 아이콘이 생기고, 앱처럼 꽉 찬 화면으로 열려요.', true);
    });
    $('install-btn').addEventListener('click', async () => {
      if (!deferred) return;
      deferred.prompt();
      await deferred.userChoice.catch(() => null);
      deferred = null; hideInstall(false);
    });
    window.addEventListener('appinstalled', () => hideInstall(false));
    const ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
      showInstall(/CriOS|FxiOS|EdgiOS|NAVER|KAKAOTALK/.test(ua)
        ? '사파리(Safari)로 이 주소를 연 뒤, 아래쪽 공유 버튼(□↑) → ‘홈 화면에 추가’를 눌러요.'
        : '아래쪽 공유 버튼(□↑)을 누르고 ‘홈 화면에 추가’를 눌러요.', false);
    } else if (/KAKAOTALK|NAVER\(inapp/.test(ua)) {
      showInstall('오른쪽 위 ⋮ 메뉴에서 ‘다른 브라우저로 열기(크롬)’를 누른 뒤 설치해요.', false);
    }

    // 3) 오프라인 안내를 위해 이 페이지와 아이콘을 저장해 둡니다.
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
